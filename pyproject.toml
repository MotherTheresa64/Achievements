[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "achievement-lab"
version = "0.1.0"
description = "A tiny GitHub achievement progress tracker and workflow lab"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Noah Ragan"}]

[project.scripts]
achievement-lab = "achievement_lab.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
