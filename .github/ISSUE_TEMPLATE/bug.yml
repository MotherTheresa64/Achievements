name: Bug report
description: Report incorrect behavior in the tracker or repository automation
title: "bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a reproducible problem.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command, input values, or workflow involved.
      placeholder: |
        1. Run ...
        2. Pass ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add logs or other details, but do not include secrets.
