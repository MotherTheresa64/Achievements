name: Feature request
description: Propose a focused improvement to the tracker or workflow lab
title: "feat: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Explain the user or maintenance need this feature would address.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful change that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes that would make the work complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: checkboxes
    id: quality
    attributes:
      label: Quality check
      options:
        - label: This request represents useful project work rather than activity created only for profile metrics.
          required: true
